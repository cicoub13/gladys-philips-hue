# -----------------------------------------------------------------------------
# Continuous integration: runs on every push, every pull request, and before
# every release (called by release.yml).
#
# MANAGED BY integration-kit — edit the template there, not this copy: the next
# `sync.sh` run would overwrite a local change.
#
# Gates:
#   1. Prettier  -> consistent formatting (no style debates in reviews);
#   2. ESLint    -> catch real mistakes (undefined vars, dead code, ...);
#   3. Tests     -> `node --test`, the built-in runner. When the repo defines a
#                   `coverage` script, it runs instead, so its thresholds gate;
#   4. npm audit -> production dependencies only;
#   5. Image     -> the Dockerfile builds and its image passes a Trivy scan,
#                   checked here instead of after the image is published.
#
# Runs on Node 24, the version the Docker image ships with (see the Dockerfile),
# so the check exercises the exact runtime the integration runs on.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Called by release.yml: no release is cut on a red suite.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes; runs on main all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint & test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests (with the coverage floor when the repo defines one)
        run: |
          if jq -e '.scripts.coverage' package.json > /dev/null; then
            npm run coverage
          else
            npm test
          fi

      - name: Audit the production dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build the image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only and no push: this gate is about "does the Dockerfile still
      # build, and is it clean", the multi-arch publish stays in build.yml.
      # Loaded into the local Docker daemon for the scan below.
      - name: Build (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-image:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on a fixable HIGH/CRITICAL vulnerability in the image (base image
      # or production dependencies). Runs here, before anything is published:
      # release.yml calls this workflow before it tags, so a vulnerable image
      # never ships.
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-image:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
