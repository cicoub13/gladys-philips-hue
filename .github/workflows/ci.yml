# -----------------------------------------------------------------------------
# Quality gate: lint, formatting and unit tests.
#
# Runs on every push and pull request, and is called by the Release workflow
# (workflow_call) so a release can never be cut with a red test suite.
# -----------------------------------------------------------------------------
name: CI

permissions:
  contents: read

on:
  # Branch pushes are covered by `pull_request`; listening to both would run
  # everything twice on every PR.
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# Superseded runs are pointless: only the latest commit matters. Keyed on the
# workflow too, so a push to main never cancels the CI gating a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Belt and braces with `--test-timeout`: a hanging test must never hold a
    # runner for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test
