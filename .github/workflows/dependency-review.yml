# -----------------------------------------------------------------------------
# Dependency review: on every pull request, fails when the change ADDS a
# dependency with a known HIGH/CRITICAL vulnerability. Complements the
# `npm audit` gate of ci.yml, which looks at the whole tree instead of the diff.
#
# MANAGED BY integration-kit — edit the template there, not this copy: the next
# `sync.sh` run would overwrite a local change.
# -----------------------------------------------------------------------------
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
